<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Parental Control</title>
<style>
:root{--bg:#f1f3fa;--card:#fff;--tx:#161a2b;--mut:#6a7090;--bd:#e4e7f2;--pri:#4f46e5;--tk:#7c3aed;--sh:0 4px 14px #1a1f4012;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f111c;--card:#1a1d2e;--tx:#eef0fb;--mut:#9ba1c6;--bd:#2a2e4a;--sh:none}}
:root[data-theme="dark"]{--bg:#0f111c;--card:#1a1d2e;--tx:#eef0fb;--mut:#9ba1c6;--bd:#2a2e4a;--sh:none}
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}*{box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}h1{font-size:22px;margin:0;letter-spacing:-.3px}header small{color:var(--mut)}
.plus{width:46px;height:46px;border-radius:16px;border:0;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-size:28px;box-shadow:0 6px 16px #4f46e555}
main{flex:1;overflow:auto;padding:0 14px 16px}
nav{display:flex;gap:4px;padding:6px 8px;background:var(--card);border-top:1px solid var(--bd)}nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0;font-size:11px;border-radius:14px}nav button span{display:block;font-size:20px}nav .a{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent);font-weight:700}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{flex:1;background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--sh);text-align:center}.chip b{display:block;font-size:20px}.chip small{color:var(--mut);font-size:11px}.chip.bad b{color:#ef4444;animation:bl 1s infinite}.chip.ok b{color:#22c55e}
.mapw{border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh);position:relative;background:#16241c}.stage{position:relative;overflow:hidden;margin:auto;background:linear-gradient(135deg,#1c2e24,#26382c)}
.stage .sat{position:absolute;width:256px;height:256px;max-width:none;user-select:none}.stage::after{content:"";position:absolute;inset:0;pointer-events:none}.stage[data-f]::after{content:"Satellite imagery not available in this view · tap a pin to open Google Maps";color:#cfe8d6;font-size:11px;padding:8px 10px;display:block;inset:auto 0 0 0;background:#0007}
.badge{position:absolute;left:10px;top:10px;z-index:3;background:#000a;color:#fff;font-size:11px;padding:4px 9px;border-radius:99px}.empty{height:150px;display:grid;place-items:center;color:#cfe8d6;font-size:13px;text-align:center;padding:20px}
.pin{position:absolute;transform:translate(-50%,-100%);text-decoration:none;display:flex;flex-direction:column;align-items:center;z-index:2}.pin b{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 3px 8px #0008}.pin.bad b{background:#ef4444;animation:bl 1s infinite}.pin span{margin-top:5px;background:#000b;color:#fff;font-size:11px;padding:2px 7px;border-radius:8px;white-space:nowrap}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:2px solid transparent;border-top:6px solid var(--c);position:relative}.card.on{border-color:#22c55e55;border-top-color:var(--c);background:color-mix(in srgb,#22c55e 8%,var(--card))}.card.bad{border-color:#ef444477;border-top-color:var(--c)}
.top{display:flex;gap:12px;align-items:center}.av{width:48px;height:48px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}.top b{font-size:17px}.top small{display:block;color:var(--mut);font-size:12px}
.st{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff}.st.on{background:#22c55e}.st.bad{background:#ef4444;animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
.bat{display:flex;align-items:center;gap:8px;margin:12px 0 10px;font-size:12px;color:var(--mut)}.bar{flex:1;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.warn{color:#ef4444;font-size:12px;font-weight:600;margin:8px 0}.acts{display:flex;gap:8px}.acts>*{flex:1}
.b{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px 14px;background:var(--pri);color:#fff;font:inherit;font-weight:600;margin:4px 0;width:100%}.b.g{background:var(--bd);color:var(--tx)}.b.r{background:#ef4444}.b.x{width:auto}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}.sheet.o{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:auto auto 0;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
h3{margin:0 0 12px;font-size:18px}input,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.it{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh)}.it.tk{border-left:6px solid var(--tk)}.inf{flex:1;min-width:0}.inf small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.inf b.d{text-decoration:line-through;opacity:.5}.late{color:#ef4444!important;font-weight:600}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin:10px 0}.cal div{padding:8px 0;border-radius:12px;font-size:13px;background:var(--card);min-height:46px}.cal .h{background:none;min-height:0;color:var(--mut);font-size:11px}.cal .s{outline:2px solid var(--pri)}.cal .t{font-weight:700;color:var(--pri)}.dots{display:flex;gap:2px;justify-content:center;margin-top:4px}.dots i{width:6px;height:6px;border-radius:50%}
.tip{font-size:12px;color:var(--mut);margin:8px 2px}.hero{text-align:center;padding:40px 20px;color:var(--mut)}
</style></head><body>
<header><div><h1>Parental Control</h1><small id="sub">Family &amp; valuables tracker</small></div><button class="plus" onclick="addNew()" aria-label="Add">+</button></header>
<main id="m"></main><nav id="nav"></nav>
<div class="sheet" id="sh" onclick="if(event.target==this)closeS()"><div id="shc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#3b82f6','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#f97316','#14b8a6','#a855f7'];
const SVC='0000ffe0-0000-1000-8000-00805f9b34fb',CHR='0000ffe1-0000-1000-8000-00805f9b34fb';
const gm=t=>`https://maps.google.com/?q=${t.lat},${t.lon}&t=k`;
let id=10,S={tab:'track',tr:[],files:[],tasks:[],acts:[],cal:new Date(),day:null};
function mk(name,type,on,sim,lat,lon,bat){const t={id:id++,name,type,c:COL[S.tr.length%COL.length],on,sim,lat,lon,bat,trail:lat==null?[]:[[lat,lon]],last:0};S.tr.push(t);return t}
mk('Aarav','Child',true,true,13.0827,80.2707,82);mk('Diya','Child',true,true,13.0850,80.2740,57);mk('Passport bag','Object',false,false,13.0790,80.2650,12);
const TABS=[['track','📍','Track'],['vault','📁','Vault'],['tasks','✅','Tasks'],['cal','📅','Calendar']];
function go(t){S.tab=t;render()}
/* satellite map: Esri World Imagery tiles, positioned by hand */
const WP=z=>256*2**z,X=(lo,z)=>(lo+180)/360*WP(z),Y=(la,z)=>{const s=Math.sin(la*Math.PI/180);return(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*WP(z)};
function mapHTML(list,W,H){list=list.filter(t=>t.lat!=null);
if(!list.length)return`<div class="mapw"><div class="empty">🛰 No GPS location yet.<br>Connect the hardware and wait for a satellite fix.</div></div>`;
const la=list.map(t=>t.lat),lo=list.map(t=>t.lon),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);let z=17;
while(z>3&&(X(d,z)-X(c,z)>W-120||Y(a,z)-Y(b,z)>H-130))z--;
const cx=(X(c,z)+X(d,z))/2-W/2,cy=(Y(a,z)+Y(b,z))/2-H/2,n=2**z;let tiles='';
for(let tx=Math.floor(cx/256);tx<=Math.floor((cx+W)/256);tx++)for(let ty=Math.floor(cy/256);ty<=Math.floor((cy+H)/256);ty++)if(ty>=0&&ty<n)tiles+=`<img class="sat" alt="" draggable="false" style="left:${tx*256-cx}px;top:${ty*256-cy}px" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${((tx%n)+n)%n}" onerror="this.closest('.stage').dataset.f=1;this.remove()">`;
const tr=list.map(t=>t.trail.length>1?`<polyline fill="none" stroke="${t.c}" stroke-width="3" opacity=".8" points="${t.trail.map(p=>(X(p[1],z)-cx).toFixed(0)+','+(Y(p[0],z)-cy).toFixed(0)).join(' ')}"/>`:'').join('');
const pins=list.map(t=>`<a class="pin ${t.on?'':'bad'}" style="--c:${t.c};left:${X(t.lon,z)-cx}px;top:${Y(t.lat,z)-cy}px" href="${gm(t)}" target="_blank" rel="noopener" aria-label="Open ${esc(t.name)} in Google Maps"><b></b><span>${esc(t.name)}</span></a>`).join('');
return`<div class="mapw"><span class="badge">🛰 Satellite · tap pin = Google Maps</span><div class="stage" style="width:${W}px;height:${H}px">${tiles}<svg width="${W}" height="${H}" style="position:absolute;inset:0">${tr}</svg>${pins}</div></div>`}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]?'a':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#m').innerHTML={track:rTrack,vault:rVault,tasks:rTasks,cal:rCal}[S.tab]()}
function rTrack(){if(!S.tr.length)return'<div class="hero">Tap <b>+</b> to add a child or an important object.</div>';
const on=S.tr.filter(t=>t.on).length,off=S.tr.length-on,low=S.tr.filter(t=>t.bat<20).length,W=Math.min($('#m').clientWidth-28,600);
return`<div class="chips"><div class="chip ok"><b>${on}</b><small>Online</small></div><div class="chip ${off?'bad':''}"><b>${off}</b><small>Offline</small></div><div class="chip"><b>${low}</b><small>Low battery</small></div></div>`+mapHTML(S.tr,W,250)+
S.tr.map(t=>`<div class="card ${t.on?'on':'bad'}" style="--c:${t.c}"><span class="st ${t.on?'on':'bad'}">${t.on?'● Live':'● Offline'}</span><div class="top" onclick="openT(${t.id})"><div class="av">${esc(t.name[0]||'?')}</div><div><b>${esc(t.name)}</b><small>${t.type}${t.lat!=null?' · '+t.lat.toFixed(5)+', '+t.lon.toFixed(5):' · waiting for GPS'}</small></div></div><div class="bat">🔋<div class="bar"><i style="width:${t.bat}%;background:${t.bat<20?'#ef4444':'#22c55e'}"></i></div><b>${t.bat}%</b></div>${t.on?'':'<div class="warn">⚠ No signal – check board power, battery or Bluetooth range.</div>'}${t.bat<20?'<div class="warn">🪫 Low battery – charge soon.</div>':''}<div class="acts">${t.lat!=null?`<a class="b" href="${gm(t)}" target="_blank" rel="noopener">🧭 Open in Google Maps</a>`:''}<button class="b g" onclick="openT(${t.id})">⚙ Manage</button></div></div>`).join('')}
function openS(h){$('#shc').innerHTML=h;$('#sh').classList.add('o')}function closeS(){$('#sh').classList.remove('o');render()}
function addNew(){const a=S.tab;if(a=='vault')return fi.click();
if(a=='tasks')return openS(`<h3>New task</h3><input id="tt" placeholder="e.g. Pick up Aarav from school"><input id="td" type="datetime-local"><select id="tb"><option value="0">Alarm at due time</option><option value="15">15 min before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select><button class="b" onclick="addTask()">Save task</button>`);
if(a=='cal')return addAct(S.day||dk(new Date()));
openS(`<h3>Add child / object / person</h3><input id="nn" placeholder="Name (e.g. Aarav, Laptop bag)"><select id="ty"><option>Child</option><option>Object</option><option>Person</option></select><button class="b" onclick="addT(true)">🔗 Add &amp; connect hardware</button><button class="b g" onclick="addT(false)">Add now, connect later</button><p class="tip">Power the ESP32 first, then choose it from the Bluetooth list. You can rename it any time.</p>`)}
function addT(c){const n=$('#nn').value.trim();if(!n)return $('#nn').focus();const t=mk(n,$('#ty').value,false,false,null,null,0);closeS();if(c)ble(t)}
function openT(i){const t=S.tr.find(x=>x.id==i);openS(`<h3>${esc(t.name)}</h3>${mapHTML([t],Math.min(innerWidth,640)-32,220)}<input value="${esc(t.name)}" oninput="S.tr.find(x=>x.id==${i}).name=this.value" aria-label="Rename"><p class="tip">Rename above. Battery ${t.bat}% · ${t.on?'Connected':'Not connected'}</p>${t.lat!=null?`<a class="b" href="${gm(t)}" target="_blank" rel="noopener">🧭 Open in Google Maps (satellite)</a>`:''}<button class="b g" onclick="closeS();ble(S.tr.find(x=>x.id==${i}))">🔗 Connect hardware</button><button class="b g" onclick="demo(${i})">${t.sim?'Stop demo signal':'Run demo signal'}</button><button class="b r" onclick="S.tr=S.tr.filter(x=>x.id!=${i});closeS()">Remove</button>`)}
function demo(i){const t=S.tr.find(x=>x.id==i);t.sim=!t.sim;t.on=t.sim;if(t.sim){if(t.lat==null){t.lat=13.0827;t.lon=80.2707;t.trail=[[t.lat,t.lon]]}if(!t.bat)t.bat=70}closeS()}
async function ble(t){const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BluetoothLe;
if(!P)return alert('Bluetooth works in the installed Android app.');
try{await P.initialize();const d=await P.requestDevice({optionalServices:[SVC]}),dev=d.deviceId;await P.connect({deviceId:dev});
await P.addListener('notification|'+dev+'|'+SVC+'|'+CHR,e=>{const h=String(e.value||'').replace(/[^0-9a-f]/gi,'');let x='';for(let i=0;i<h.length;i+=2)x+=String.fromCharCode(parseInt(h.substr(i,2),16));const[la,lo,b]=x.split(',').map(Number);if(isNaN(la)||isNaN(lo))return;t.lat=la;t.lon=lo;if(!isNaN(b))t.bat=b;t.last=Date.now();t.on=true;t.sim=false;t.trail.push([la,lo]);if(t.trail.length>40)t.trail.shift();if(!$('#sh').classList.contains('o')&&S.tab=='track')render()});
await P.addListener('disconnected|'+dev,()=>{t.on=false;render()});
await P.startNotifications({deviceId:dev,service:SVC,characteristic:CHR});t.on=true;t.sim=false;t.last=Date.now();render()}catch(e){t.on=false;render();alert('Could not connect: '+(e.message||e))}}
setInterval(()=>{S.tr.forEach(t=>{if(t.sim&&t.on&&t.lat!=null){t.lat+=(Math.random()-.5)*.0003;t.lon+=(Math.random()-.5)*.0003;t.trail.push([t.lat,t.lon]);if(t.trail.length>40)t.trail.shift();if(Math.random()<.1&&t.bat>1)t.bat--}else if(!t.sim&&t.last&&t.on&&Date.now()-t.last>15000)t.on=false});if(S.tab=='track'&&!$('#sh').classList.contains('o'))render()},4000);
/* Vault */
const fi=document.createElement('input');fi.type='file';fi.multiple=true;fi.accept='image/*,.pdf';fi.hidden=true;fi.onchange=()=>{[...fi.files].forEach(f=>S.files.push({n:f.name,s:f.size,u:URL.createObjectURL(f),k:'Other'}));fi.value='';render()};document.body.append(fi);
function rVault(){return`<p class="tip">Keep Aadhar, passport, school papers, photos and PDFs together. Files stay on this device for this session.</p><button class="b" onclick="fi.click()">⬆ Upload image / PDF</button><div style="height:8px"></div>`+(S.files.length?'':'<div class="hero">No documents yet.</div>')+S.files.map((f,i)=>`<div class="it"><div class="inf"><b>${esc(f.n)}</b><small>${(f.s/1024).toFixed(0)} KB · <a href="${f.u}" target="_blank">Open</a></small></div><select style="width:105px;margin:0" onchange="S.files[${i}].k=this.value">${['Aadhar','Passport','School','Medical','Other'].map(k=>`<option ${k==f.k?'selected':''}>${k}</option>`).join('')}</select><button class="b r x" onclick="S.files.splice(${i},1);render()">✕</button></div>`).join('')}
/* Tasks */
function addTask(){const t=$('#tt').value.trim(),d=$('#td').value;if(!t||!d)return;S.tasks.push({id:id++,t,due:new Date(d).getTime(),b:+$('#tb').value,done:false,f:false});closeS()}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),900)}catch(e){}}
setInterval(()=>{S.tasks.forEach(k=>{if(!k.done&&!k.f&&Date.now()>=k.due-k.b*60000){k.f=true;beep();alert('⏰ '+k.t);render()}})},15000);
function rTasks(){const l=[...S.tasks].sort((a,b)=>a.done-b.done||a.due-b.due);if(!l.length)return'<div class="hero">No tasks yet.<br>Tap + to add one – tasks show in purple.</div>';
return'<p class="tip">Alarms ring while the app is open.</p>'+l.map(k=>{const late=!k.done&&k.due<Date.now();return`<div class="it tk"><input type="checkbox" style="width:24px;height:24px;margin:0" ${k.done?'checked':''} onchange="S.tasks.find(x=>x.id==${k.id}).done=this.checked;render()"><div class="inf"><b class="${k.done?'d':''}">${esc(k.t)}</b><small class="${late?'late':''}">${late?'Overdue · ':''}${new Date(k.due).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}${k.b?' · alarm '+(k.b>=1440?'1 day':k.b>=60?'1 hr':k.b+' min')+' before':''}</small></div><button class="b r x" onclick="S.tasks=S.tasks.filter(x=>x.id!=${k.id});render()">✕</button></div>`}).join('')}
/* Calendar */
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function mv(n){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+n,1);render()}
const col=w=>(S.tr.find(t=>t.id==w)||{c:'#64748b'}).c,nm=w=>(S.tr.find(t=>t.id==w)||{name:'General'}).name;
function rCal(){const y=S.cal.getFullYear(),m=S.cal.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),today=dk(new Date());S.day=S.day||today;
let c=['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="background:none"></div>'.repeat(f);
for(let d=1;d<=n;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),dots=S.acts.filter(a=>a.d==k).map(a=>`<i style="background:${col(a.w)}"></i>`).join('');c+=`<div class="${k==S.day?'s':''} ${k==today?'t':''}" onclick="S.day='${k}';render()">${d}<div class="dots">${dots}</div></div>`}
const L=S.acts.filter(a=>a.d==S.day).sort((a,b)=>a.tm.localeCompare(b.tm));
return`<div class="row"><button class="b g x" onclick="mv(-1)">‹</button><b>${S.cal.toLocaleString([],{month:'long',year:'numeric'})}</b><button class="b g x" onclick="mv(1)">›</button></div><div class="cal">${c}</div><button class="b" onclick="addAct(S.day)">+ Activity on ${S.day}</button><div style="height:8px"></div>`+L.map(a=>`<div class="it" style="border-left:6px solid ${col(a.w)}"><div class="inf"><b>${esc(a.t)}</b><small>${a.tm} · ${esc(nm(a.w))} · ${a.s=='done'?'✅ Happened':a.s=='missed'?'❌ Did not happen':S.day<today?'Not confirmed':'Planned'}</small></div><button class="b g x" onclick="st(${a.id},'done')">✓</button><button class="b r x" onclick="st(${a.id},'missed')">✗</button></div>`).join('')}
function st(i,s){S.acts.find(a=>a.id==i).s=s;render()}
function addAct(d){openS(`<h3>New activity · ${d}</h3><input id="at" placeholder="e.g. Football practice"><input id="am" type="time" value="16:00"><select id="aw">${S.tr.filter(t=>t.type!='Object').map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}<option value="0">General</option></select><button class="b" onclick="saveAct('${d}')">Save</button>`)}
function saveAct(d){const t=$('#at').value.trim();if(!t)return;S.acts.push({id:id++,d,t,tm:$('#am').value,w:+$('#aw').value,s:'plan'});closeS()}
render();
</script></body></html>
